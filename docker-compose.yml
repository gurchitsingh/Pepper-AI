services:
  db:
    image: pgvector/pgvector:pg16
    container_name: weave_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: weave_user
      POSTGRES_PASSWORD: weave_password
      POSTGRES_DB: weave_ai_db
    ports:
      - "5432:5432"
    volumes:
      - weave_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: weave_ai_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - weave_redisdata:/data

volumes:
  weave_pgdata:
  weave_redisdata: